name: CI Tests Reusable Workflow

on:
  workflow_call:
    inputs:
      run-version-check:
        type: boolean

permissions:          
  contents: write


jobs:

  test:
    name: Test (Project Python Version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv sync --all-extras
      - name: Run tests with coverage
        run: uv run pytest -v --cov --cov-report=xml --cov-report=term-missing
      - name: Generate coverage badge
        if: github.event_name == 'push'
        run: |
          uv run genbadge coverage -i coverage.xml -o coverage.svg
      - name: Commit coverage badge
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push