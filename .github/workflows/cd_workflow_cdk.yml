name: CD Reusable Workflow

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'
    environment: ${{ github.ref == 'refs/heads/prod' && 'PROD' || 'DEV' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Determine CDK role suffix for gds-dtx repos
        id: role-suffix
        run: |
          if [ "${{ github.repository_owner }}" = "gds-dtx" ]; then
            REPO_NAME="${{ github.event.repository.name }}"
            case "$REPO_NAME" in
              gds-idea-app-*)
                SUFFIX="-${REPO_NAME#gds-idea-app-}"
                ;;
              *)
                echo "::error::Repository '$REPO_NAME' in gds-dtx must be prefixed with 'gds-idea-app-' to derive the CDK role suffix."
                exit 1
                ;;
            esac
          else
            SUFFIX=""
          fi
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC) for Dev deployment
        if: github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::992382722318:role/cdk-dev-deploy${{ steps.role-suffix.outputs.SUFFIX }}
          aws-region: eu-west-2
          role-session-name: ${{ github.event.repository.name }}

      - name: Configure AWS credentials (OIDC) for Prod deployment
        if: github.ref == 'refs/heads/prod'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::588077357019:role/cdk-prod-deploy${{ steps.role-suffix.outputs.SUFFIX }}
          aws-region: eu-west-2
          role-session-name: ${{ github.event.repository.name }}

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK synth
        run: |
          source .venv/bin/activate
          PHASE=${{ github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
          cdk synth --context phase=$PHASE

      - name: CDK deploy
        run: |
          source .venv/bin/activate
          PHASE=${{ github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
          cdk deploy --all --require-approval never --context phase=$PHASE
