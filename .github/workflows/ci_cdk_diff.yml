name: CI CDK PR Diff Reusable Workflow

on:
  workflow_call:
    inputs:
      run-version-check:
        type: boolean

jobs:

  cdk-diff:
    if: github.event_name == 'pull_request'
    name: CDK Diff (comment on PR)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Determine CDK role suffix for gds-dtx repos
        id: role-suffix
        run: |
          if [ "${{ github.repository_owner }}" = "gds-dtx" ]; then
            REPO_NAME="${{ github.event.repository.name }}"
            case "$REPO_NAME" in
              gds-idea-app-*)
                SUFFIX="-${REPO_NAME#gds-idea-app-}"
                ;;
              *)
                echo "::error::Repository '$REPO_NAME' in gds-dtx must be prefixed with 'gds-idea-app-' to derive the CDK role suffix."
                exit 1
                ;;
            esac
          else
            SUFFIX=""
          fi
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Select env from PR target branch
        id: env
        run: |
          if [ "${{ github.base_ref }}" = "dev" ]; then
            echo "PHASE=dev" >> $GITHUB_OUTPUT
            echo "ROLE_ARN=arn:aws:iam::992382722318:role/cdk-dev-diff${{ steps.role-suffix.outputs.SUFFIX }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" = "prod" ]; then
            echo "PHASE=prod" >> $GITHUB_OUTPUT
            echo "ROLE_ARN=arn:aws:iam::588077357019:role/cdk-prod-diff${{ steps.role-suffix.outputs.SUFFIX }}" >> $GITHUB_OUTPUT
          else
            echo "Unsupported base branch: ${{ github.base_ref }}"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.env.outputs.ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: ${{ github.event.repository.name }}

      - name: CDK synth (produce cdk.out)
        run: |
          source .venv/bin/activate
          cdk synth --context phase=${{ steps.env.outputs.PHASE }}

      - name: CDK Diff (comment on PR)
        uses: corymhall/cdk-diff-action@v2
        with:
          failOnDestructiveChanges: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
